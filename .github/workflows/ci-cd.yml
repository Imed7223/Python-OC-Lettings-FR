name: CI/CD - OC Lettings Django

on:
  push:
    branches: [ main, develop, feature/modular-architecture ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.14'
  DJANGO_SETTINGS_MODULE: 'oc_lettings_site.settings'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8
    
    - name: Lint with flake8
      run: flake8 . --max-line-length=88
    
    - name: Test with pytest
      env:
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      run: |
        pytest --cov=oc_lettings_site --cov=lettings --cov=profiles \
               --cov-report=xml --cov-report=term-missing \
               --junitxml=pytest.xml
    
    - name: Upload coverage to GitHub
      uses: codecov/codecov-action@v4
      with:
        file: coverage.xml


  docker-build:
    needs: lint-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/oc-lettings:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/oc-lettings:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

