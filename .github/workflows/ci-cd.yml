name: CI/CD - OC Lettings Django

on:
  push:
    branches: [ feature/modular-architecture ]
  pull_request:
    branches: [ main ]

env:
  # CORRECTION : Passage à la version stable 3.11 pour compatibilité Django 4.2
  PYTHON_VERSION: '3.11'
  DJANGO_SETTINGS_MODULE: 'oc_lettings_site.settings'

jobs:
  # 1) Lint + Tests + Coverage
  lint-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

    - name: Install & Lint
      run: |
        python -m pip install --upgrade pip
        # Installation des dépendances corrigées (Sphinx/Docutils via requirements.txt)
        pip install -r requirements.txt 
        # Note: ruff, pytest et pytest-cov devraient être dans votre requirements.txt
        # Sinon, gardez-les ici :
        pip install ruff pytest pytest-cov 
        
        # Exécution du linter (Ruff)
        ruff check . --line-length=88

    - name: Test with coverage
      env:
        # Assurez-vous que ces secrets sont configurés dans GitHub > Settings > Secrets
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        SECRET_KEY: "test-key-for-ci"
      run: |
        # Correction de la commande pytest pour inclure les nouveaux modules
        pytest --cov=oc_lettings_site --cov=lettings --cov=profiles \
               --cov-report=xml --cov-report=term-missing \
               --junitxml=pytest.xml

  # 2) Docker Build & Push (main uniquement)
  docker-build:
    needs: lint-test
    runs-on: ubuntu-latest
    # Déclenchement uniquement sur push dans main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & Push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/oc-lettings:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/oc-lettings:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 3) Déploiement Render (main uniquement)
  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Trigger Render
      run: curl -X POST ${{ secrets.RENDER_WEBHOOK_URL }}
